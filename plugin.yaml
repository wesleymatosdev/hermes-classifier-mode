name: hermes-classifier-mode
version: "0.1.0"
description: "Claude Code `auto` permission mode for Hermes: routes shell commands through a local LLM classifier (Ollama) before execution. Static fast paths for read-only commands and catastrophic patterns; classifier verdicts allow/block; unreachable classifier escalates to the human approval gate (fail-closed). Configure via classifier_mode: in config.yaml."
author: "Wesley Matos"
hooks:
  - pre_tool_call
